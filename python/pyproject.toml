[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "company-social-mcp"
version = "0.1.0"
description = "Stdio MCP server that finds a company's LinkedIn, X, YouTube, Instagram and Facebook profiles via Apify's hosted MCP gateway"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "mcp-server", "apify", "company-social-profiles", "linkedin", "lead-generation", "enrichment"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=2.3,<3", "anyio>=4.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
company-social-mcp = "company_social_mcp.server:main"

[project.urls]
Homepage = "https://github.com/GeminiGeorge22/company-social-mcp"
Source = "https://github.com/GeminiGeorge22/company-social-mcp/tree/main/python"
Issues = "https://github.com/GeminiGeorge22/company-social-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/company_social_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
